# /etc/nginx/conf.d/hardening.conf 에 둔다. certbot이 고친 사이트 설정은 건드리지 않고 http 전체에 적용된다.

# 응답 헤더와 에러 페이지에서 nginx 버전을 숨긴다.
server_tokens off;

# IP당 초당 10번, 순간 40번까지. 앱 첫 화면이 한 번에 여러 API를 불러도 걸리지 않는 값이다.
# ponytail: IP 하나 기준이라 같은 와이파이(학교·회사) 사용자가 많으면 burst를 올린다.
limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;
limit_req zone=perip burst=40 nodelay;
limit_req_status 429;

# 도메인 없이 IP로 직접 들어오는 요청(스캐너 대부분)은 Django까지 보내지 않고 연결을 끊는다.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}
