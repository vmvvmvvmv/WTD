# /etc/nginx/sites-available/weathertodo 에 둔다. HTTPS(443) 설정은 certbot --nginx가 이 파일에 덧붙인다.
server {
    listen 80;
    server_name dust.vmv-lab.com;

    client_max_body_size 1m;

    location /static/ {
        alias /home/ubuntu/WTD/backend/staticfiles/;
        expires 7d;
    }

    location / {
        proxy_pass http://unix:/run/weathertodo/gunicorn.sock;
        proxy_set_header Host $host;
        # Django는 TRUSTED_PROXY_COUNT=1일 때 이 값으로 접속 주소(AI 하루 제한 기준)를 구한다.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
